name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: backend tests
        run: cd backend && DB_PATH=/tmp/ci-backend.db npx vitest run
      - name: admin tests
        run: cd frontend-admin && npx vitest run
      - name: pwa tests
        run: cd frontend && npx vitest run
